<!-- @dsCard group="Feedback" height=320 subtitle="Success, warning, error and info" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body style="margin:0;padding:20px;background:var(--bg-base)">
<div id="root"></div>
<script>
  var Q = window.QuincyOSDesignSystem_019dc5, h = React.createElement;
  var link = { font: 'inherit', fontSize: 'var(--text-xs)', fontWeight: 500, color: 'var(--text-accent)', background: 'transparent',
    border: 0, padding: '4px 6px', borderRadius: 'var(--radius-sm)', cursor: 'pointer' };
  function noop() {}
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 380 } },
      h(Q.Toast, { variant: 'success', title: 'Added to Holiday 2026', description: 'Ray-Ban Meta Wayfarer (Gen 2)',
        action: h('button', { type: 'button', style: link }, 'Undo'), onDismiss: noop }),
      h(Q.Toast, { variant: 'warning', title: "Couldn't read that page", description: 'Add the details yourself. The link is saved.' }),
      h(Q.Toast, { variant: 'error', title: "Couldn't save. Try again.", action: h('button', { type: 'button', style: link }, 'Retry') }),
      h(Q.Toast, { variant: 'info', title: 'Share link copied', onDismiss: noop })));
</script>
</body>
</html>
